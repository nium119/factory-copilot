# Chain definitions — multi-step analysis with data queries + LLM reasoning
#
# Structure:
#   Phase 1: Query Neo4j for real data (concepts discovered from ontology relations)
#   Phase 2: Chain LLM reasoning steps (each step depends on previous output + real data)
#   Phase 3: Final LLM synthesis
#
# Prompt template variables:
#   {message}       — original user message
#   {data_context}  — Phase 1 query results (all concepts)
#   {step_id}       — any previous reasoning step output (keyed by output_key)

fault_diagnosis:
  name: "设备故障诊断"
  description: "诊断设备故障 → 备件库存检查 → 排产影响评估 → 处理建议"
  triggers:
    - "故障.*诊断"
    - "设备.*故障"
    - "设备.*坏"
    - "设备.*异常"
    - "停机.*原因"
    - "诊断.*故障"
  final_agent: "quality_equipment"
  reasoning_steps:
    - step_id: "diagnose"
      description: "故障诊断"
      agent_name: "quality_equipment"
      prompt_template: |
        诊断以下设备故障，输出简洁结论（3-5句，用表格列出可能原因和排查方向）。

        ## 实时数据
        {data_context}

        ## 用户问题
        {message}
      output_key: "diagnosis_result"
    - step_id: "spare_parts"
      description: "备件检查"
      agent_name: "production_management"
      prompt_template: |
        根据诊断结果检查备件库存，用表格列出（3行以内）。

        ## 诊断结果
        {diagnosis_result}

        ## 实时数据
        {data_context}
      output_key: "spare_parts_status"
    - step_id: "schedule_impact"
      description: "排产影响"
      agent_name: "production_management"
      prompt_template: |
        根据诊断和备件情况评估排产影响，用表格列出（3行以内）。

        ## 诊断结果
        {diagnosis_result}

        ## 备件库存
        {spare_parts_status}

        ## 实时数据
        {data_context}
      output_key: "schedule_impact_info"
  final_prompt_template: |
    汇总以下故障诊断全貌，给出处理步骤（P0/P1/P2，含预期时间线）。

    ## 诊断结果
    {diagnosis_result}

    ## 备件库存
    {spare_parts_status}

    ## 排产影响
    {schedule_impact_info}

    ## 用户问题
    {message}


quality_analysis:
  name: "质量缺陷分析"
  description: "质量数据概览 → 根因分析 → 改善措施 → 汇总报告"
  triggers:
    - "质量.*分析"
    - "缺陷.*分析"
    - "不良.*分析"
    - "质检.*分析"
    - "质量.*改善"
    - "质量.*改进"
  final_agent: "quality_equipment"
  reasoning_steps:
    - step_id: "quality_data"
      description: "质量数据概览"
      agent_name: "quality_equipment"
      prompt_template: |
        分析质量检测数据，用表格输出关键指标（3行以内）。

        ## 实时数据
        {data_context}

        ## 用户问题
        {message}
      output_key: "quality_data_info"
    - step_id: "root_cause"
      description: "根因分析"
      agent_name: "quality_equipment"
      prompt_template: |
        基于质量数据进行根因分析（5-Why），输出简洁结论（3-5句）。

        ## 质量数据
        {quality_data_info}

        ## 实时数据
        {data_context}
      output_key: "root_cause_info"
    - step_id: "improvement"
      description: "改善措施"
      agent_name: "quality_equipment"
      prompt_template: |
        基于根因给出改善措施，按紧急/短期/长期分级，用表格列出。

        ## 质量数据
        {quality_data_info}

        ## 根因分析
        {root_cause_info}

        ## 实时数据
        {data_context}
      output_key: "improvement_info"
  final_prompt_template: |
    汇总以下质量分析全貌：

    ## 质量数据
    {quality_data_info}

    ## 根因分析
    {root_cause_info}

    ## 改善措施
    {improvement_info}

    ## 用户问题
    {message}

    输出完整的质量分析报告，含 P0/P1/P2 行动项。


work_order_readiness:
  name: "工单投产准备检查"
  description: "检查物料齐套、设备状态、质检标准、SOP，一次调用输出综合判断"
  triggers:
    - "生产准备"
    - "投产准备"
    - "齐套检查"
    - "开工检查"
    - "准备检查"
    - "工单.*准备"
  final_agent: "production_execution"
  reasoning_steps: []
  final_prompt_template: |
    根据以下实时KPI数据，检查工单投产准备情况并给出是否可投产的综合判断。

    ## 数据摘要
    {data_context}

    ## 用户问题
    {message}

    ## 输出要求
    用结构化清单输出，每项用 ✅/⚠️/🔴 标注状态：
    ### 📦 物料齐套（到位率、缺料明细、预计到货）
    ### ⚙️ 设备状态（可用率、维保中、瓶颈工序）
    ### 🔬 质检标准（关键项目、检测频率、判定标准）
    ### 📋 SOP就绪（版本、培训状态、待更新文件）
    最后给出综合结论：「可投产」/「条件投产（列出条件）」/「不可投产（列出阻塞）」。


production_report:
  name: "生产综合报告"
  description: "自动查询排产进度、质量缺陷、设备安灯等核心KPI，一键生成结构化日报"
  triggers:
    - "生产.*报告"
    - "综合.*报告"
    - "生产.*总结"
    - "车间.*报告"
    - "产线.*报告"
    - "综合分析.*生产"
  reasoning_steps: []
  final_prompt_template: |
    根据以下实时KPI数据输出一份生产综合日报。

    ## 数据摘要
    {data_context}

    ## 输出要求
    先写一段3句以内的整体概览（用🔴🟡🟢标记风险等级）。
    然后分三个小节，每节先一句话概述当前最突出的问题，再跟 Markdown 表格列出3条发现：
    ### 📊 排产进度
    ### 🔍 质量状况
    ### ⚙️ 设备/安灯
    最后 ### 📋 今日行动项，按 P0/P1/P2 优先级列出3-5条。
    语言简洁专业，像日报不是论文。

    原始问题：{message}

    请用结构化清单输出，含表格和关键指标，标注异常项和改善建议。
