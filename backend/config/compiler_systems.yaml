# API 系统配置 — 编译器读取此文件为概念生成 API Skill
# 本体只管建模，系统和 API 配置在此独立管理

systems:
  mes:
    type: api
    baseUrl: ""
    authType: bearer
    authConfig:
      token: "${MES_API_TOKEN}"
    description: MES 生产执行系统
    concepts:
      - WorkOrder
      - WorkOrderTask
      - Equipment
      - Employee
      - WorkStation

